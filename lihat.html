<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto dari QR · KLM QR Studio</title>
<meta name="theme-color" content="#14112b">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
  :root{--bg:#14112b;--card:#1f1b3d;--text:#f2f0ff;--muted:#a9a4cc;--accent:#8b7fff;--accent2:#ff5c8a;--line:#332e5c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#2a2260 0%,var(--bg) 60%);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .frame{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 30px 60px -30px #000;max-width:min(92vw,560px);width:100%;animation:in .5s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.frame{animation:none}}
  .frame img{display:block;width:100%;height:auto;border-radius:14px;background:#fff}
  .cap{font-size:18px;font-weight:700;text-align:center;margin:14px 6px 4px;text-wrap:balance}
  .meta{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button,a.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:#2a2550;color:var(--text);font:inherit;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
  button.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  button:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{max-width:420px;text-align:center;color:var(--muted);line-height:1.6}
  .empty b{color:var(--text);display:block;font-size:18px;margin-bottom:6px}
  .foot{font-size:12px;color:var(--muted)}
  .foot a{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="frame" id="frame" hidden>
    <img id="img" alt="Foto dari QR code">
    <p class="cap" id="cap" hidden></p>
    <p class="meta" id="meta"></p>
  </div>
  <div class="row" id="actions" hidden>
    <button class="primary" id="save" type="button">Simpan foto</button>
    <button id="share" type="button" hidden>Bagikan</button>
  </div>
  <div class="empty" id="empty" hidden>
    <b>Tidak ada foto di tautan ini</b>
    Halaman ini menampilkan foto yang tersimpan di dalam QR code buatan KLM QR Studio. Coba pindai ulang QR-nya.
  </div>
  <p class="foot">Dibuat dengan <a href="./">KLM QR Studio</a> — buat QR foto sendiri, gratis.</p>
<script>
(function () {
  var h = decodeURIComponent(location.hash.slice(1) || '');
  // format: <w|j><base64url>[.<keterangan>]
  var m = h.charAt(0), rest = h.slice(1), dot = rest.indexOf('.');
  var b64 = (dot >= 0 ? rest.slice(0, dot) : rest).replace(/-/g, '+').replace(/_/g, '/');
  var cap = dot >= 0 ? rest.slice(dot + 1) : '';
  if (!/^[wj]$/.test(m) || b64.length < 20) { document.getElementById('empty').hidden = false; return; }
  while (b64.length % 4) b64 += '=';
  var mime = m === 'w' ? 'image/webp' : 'image/jpeg';
  var img = document.getElementById('img');
  img.onload = function () {
    document.getElementById('frame').hidden = false;
    document.getElementById('actions').hidden = false;
    document.getElementById('meta').textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px · disimpan di dalam QR code';
  };
  img.onerror = function () { document.getElementById('empty').hidden = false; };
  img.src = 'data:' + mime + ';base64,' + b64;
  if (cap) { var c = document.getElementById('cap'); c.textContent = cap; c.hidden = false; document.title = cap + ' · Foto dari QR'; }

  function bigBlob(cb) { // perbesar halus supaya enak dilihat setelah disimpan
    var k = Math.max(1, Math.round(1080 / Math.max(img.naturalWidth, img.naturalHeight)));
    var cv = document.createElement('canvas'); cv.width = img.naturalWidth * k; cv.height = img.naturalHeight * k;
    var x = cv.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(cb, 'image/jpeg', .92);
  }
  var name = (cap || 'foto-qr').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60) + '.jpg';
  document.getElementById('save').onclick = function () {
    bigBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); });
  };
  var sh = document.getElementById('share');
  if (navigator.canShare) {
    sh.hidden = false;
    sh.onclick = function () {
      bigBlob(function (b) {
        var file = new File([b], name, { type: 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: cap || 'Foto' }).catch(function () {});
        else navigator.share({ url: location.href }).catch(function () {});
      });
    };
  }
})();
</script>
</body>
</html>
